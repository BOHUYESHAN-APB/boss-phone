# BOSS PHONE monorepo CI
# - protocol: 协议 SSOT 产物与 schema 同步校验（tools/gen-protocol --check）
# - hub:      Python hub 编译 + 逻辑测试（Linux 上验证：纠错/帧/编排）
# - firmware: ESP-IDF（RTOS）编译——构建 reference/folotoy-card-demo（复用共享 BSP）；
#             firmware/main（boss_app）落地后改为构建 firmware/
# 注：windows-native STT 与光标注入是 Windows 专属，CI 不跑（Linux 上可跳过）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: Protocol SSOT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 产物与 schema 同步校验
        run: node tools/gen-protocol/generate.mjs --check

  hub:
    name: Hub (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: 编译校验
        run: python -m compileall -q .
      - name: 逻辑测试（词表纠错 / 帧解析 / 语音输入编排）
        run: python -m pytest tests -q

  firmware:
    name: Firmware (ESP-IDF/FreeRTOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译 reference/folotoy-card-demo（ESP32-C3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32c3
          path: reference/folotoy-card-demo
