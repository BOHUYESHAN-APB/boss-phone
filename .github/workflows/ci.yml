# BOSS PHONE monorepo CI（测试分层见 DESIGN_TEST / 对话定稿的 L1-L5）
# - protocol: 协议 SSOT 产物同步（generate --check）+ 黄金向量同步（vectors --check）
#             + Rust 绑定语义校验（golden vectors roundtrip）——L2
# - hub:      Python hub 编译 + ruff lint/format + L1 单元测试（纠错/帧/session/eventbus）
#             + L2 黄金向量字节级校验 + L3 WS 集成测试（虚拟设备全链路）
# - firmware: ESP-IDF（RTOS）编译门禁——构建 reference/folotoy-card-demo（复用共享 BSP）；
#             firmware/main（boss_app）落地后改为构建 firmware/
# 注：L5 真机验收（屏幕/按键/音频）与 STT 准确率评测不进 CI——
#     前者依赖硬件人工核对，后者数字波动只出报告不做门禁。
# 注：windows-native STT 与光标注入是 Windows 专属，CI 不跑（Linux 上可跳过）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: Protocol SSOT + Golden Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成产物与 schema 同步校验
        run: node tools/gen-protocol/generate.mjs --check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 黄金向量 wire_hex 与信封定义同步校验
        run: python tools/gen-protocol/vectors.py --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust 协议绑定语义校验（golden vectors roundtrip）
        run: cargo test -p boss-protocol --quiet

  hub:
    name: Hub (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 编译校验
        run: python -m compileall -q hub tests
      - name: Lint（ruff check，规则见 hub/pyproject.toml）
        run: python -m ruff check hub tests --output-format=concise
      - name: 格式校验（ruff format --check）
        run: python -m ruff format --check hub tests
      - name: L1 单元 + L2 黄金向量 + L3 集成测试
        run: python -m pytest tests -q

  firmware:
    name: Firmware (ESP-IDF/FreeRTOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 依赖求解的两个坑（2026-11 实测，日志见 CI 历史）：
      # 1) 仓库提交了 reference/folotoy-card-demo/dependencies.lock，其 manifest_hash
      #    与 firmware/components/bsp/idf_component.yml 的依赖字段配套；改版本会失配 →
      #    触发全量重解。
      # 2) idf-component-manager 默认 CHECK_NEW_VERSION=1，构建结束后还会再跑一次
      #    "检查组件新版本"的完整求解；该次求解会枚举 esp_lvgl_port 声明的
      #    lvgl >=8,<10 的**所有**候选版本，碰到 9.6.x 时因其清单里的
      #    $CONFIG{LV_USE_FREETYPE} 条件依赖（此时 lvgl 的 Kconfig 尚未生成）
      #    直接抛 MissingKconfigError。
      # 因此：锁文件命中 + 关闭"检查新版本"求解，两者缺一不可。
      - name: 编译 reference/folotoy-card-demo（ESP32-C3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32c3
          path: reference/folotoy-card-demo
          extra_docker_args: "-e IDF_COMPONENT_CHECK_NEW_VERSION=0"
