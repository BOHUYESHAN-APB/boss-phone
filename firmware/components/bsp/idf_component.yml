dependencies:
  # ⚠️ 这里的版本必须精确锁定，不要改回 "^9.5.0" 这类范围。
  #
  # 原因（2026-11 CI 实际失败）：lvgl 9.6.0 起在组件清单里声明了
  #   - freetype      条件：idf_version >=5.5 && $CONFIG{LV_USE_FREETYPE} == True
  #   - libjpeg-turbo 条件：idf_version >=5.5 && $CONFIG{LV_USE_LIBJPEG_TURBO} == True
  # 而 idf-component-manager 在**求解依赖阶段**（lvgl 自己的 Kconfig 还没生成、
  # sdkconfig 里也还没有这些符号）就去求值 $CONFIG{...}，于是抛：
  #   idf_component_tools.errors.MissingKconfigError: LV_USE_FREETYPE
  # 只要范围允许解析到 9.6.x，CI 固件 job 就会在 "Building ESP-IDF components" 阶段挂掉。
  # lvgl 9.5.0 的清单没有条件依赖，因此精确锁定在 9.5.0。
  # 上游 FoloToy/ai-passport 的 dependencies.lock 同样解析到 9.5.0。
  #
  # 升级 lvgl 前：先在 CI 上验证该 MissingKconfigError 已在上游修复，
  # 再同步更新这里的版本与本注释。
  idf: ">=5.5.0"
  lvgl/lvgl: "9.5.0"
  espressif/esp_lvgl_port: "2.9.0"
  espressif/button: "4.2.0"
  espressif/esp_codec_dev: "1.6.2"
