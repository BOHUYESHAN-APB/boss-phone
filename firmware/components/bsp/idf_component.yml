dependencies:
  # ⚠️ 这些版本值必须与上游 FoloToy/ai-passport 的 components/bsp/idf_component.yml
  # 完全一致，且与 reference/folotoy-card-demo/dependencies.lock 里的
  # manifest_hash 配套。改动任一版本都会让 manifest_hash 失配，触发全量依赖重解
  # （重解会枚举 lvgl 9.6.x 并抛 MissingKconfigError: LV_USE_FREETYPE）。
  # 详见 .github/workflows/ci.yml 的 firmware job 注释。
  idf: ">=5.5.3,<5.6.0"
  lvgl/lvgl: "^9.5.0"
  espressif/esp_lvgl_port: "2.9.0"
  espressif/button: "4.2.0"
  espressif/esp_codec_dev: "1.6.2"
